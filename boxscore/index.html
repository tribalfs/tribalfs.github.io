<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opening Box Score App...</title>
  <meta name="description" content="Redirecting to Box Score: Score Tracker Pro Android App">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --oneui-bg: #07090e;
      --oneui-surface: rgba(22, 27, 38, 0.65);
      --oneui-surface-hover: rgba(30, 38, 54, 0.85);
      --oneui-card-border: rgba(255, 255, 255, 0.12);
      --oneui-blue: #3b82f6;
      --oneui-blue-hover: #2563eb;
      --oneui-blue-glow: rgba(59, 130, 246, 0.35);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --radius-xl: 32px;
      --radius-lg: 24px;
      --radius-pill: 9999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--oneui-bg);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient Blur Orb Background */
    .ambient-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.25;
    }

    .orb-1 {
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.7) 0%, rgba(99, 102, 241, 0.2) 100%);
      top: -100px;
      left: -80px;
    }

    .orb-2 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.6) 0%, rgba(236, 72, 153, 0.15) 100%);
      bottom: -120px;
      right: -80px;
    }

    /* Main Container Card */
    .card {
      position: relative;
      z-index: 1;
      background: var(--oneui-surface);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--oneui-card-border);
      border-radius: var(--radius-xl);
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .app-icon {
      width: 96px;
      height: 96px;
      border-radius: var(--radius-lg);
      margin: 0 auto 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      display: block;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .app-title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .app-subtitle {
      font-size: 0.95rem;
      color: var(--text-secondary);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(96, 165, 250, 0.3);
      padding: 6px 16px;
      border-radius: var(--radius-pill);
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 28px;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(96, 165, 250, 0.3);
      border-top-color: #60a5fa;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 24px;
      border-radius: var(--radius-pill);
      font-size: 0.95rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
    }

    .btn-primary {
      background: var(--oneui-blue);
      color: #ffffff;
      box-shadow: 0 4px 20px var(--oneui-blue-glow);
    }

    .btn-primary:hover {
      background: var(--oneui-blue-hover);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-primary);
      border: 1px solid var(--oneui-card-border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.14);
      transform: translateY(-2px);
    }

    .footer-links {
      margin-top: 24px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .footer-links a {
      color: var(--text-secondary);
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-links a:hover {
      color: var(--oneui-blue);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="ambient-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <div class="card">
    <img src="https://play-lh.googleusercontent.com/ZvuMkx6OduD1Tjfkbl340RTsK9VZdFUcLfgGuGFvQSpOd6Fpib9rg-Hs7VFGwFbT3G87EhAnA4x6P8C7HgXKvxA=s256" alt="Box Score Icon" class="app-icon">
    <h1 class="app-title">Box Score</h1>
    <p class="app-subtitle">Score Tracker Pro & Real-Time Match Analytics</p>

    <div class="status-badge" id="status-badge">
      <div class="spinner"></div>
      <span id="status-text">Opening Box Score App...</span>
    </div>

    <div class="btn-group">
      <a href="#" id="open-app-btn" class="btn btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        Open in Box Score App
      </a>
      <a href="https://play.google.com/store/apps/details?id=com.tribalfs.scorer" target="_blank" rel="noopener" class="btn btn-secondary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3,20.5V3.5C3,2.91 3.34,2.39 3.84,2.15L13.69,12L3.84,21.85C3.34,21.6 3,21.09 3,20.5M16.81,15.12L18.81,13.12C19.2,12.73 19.2,12.1 18.81,11.71L16.81,9.71L14.81,11.71L16.81,15.12M4.68,1.27L15.39,12L4.68,22.73C4.29,23.12 3.66,23.12 3.27,22.73C2.88,22.34 2.88,21.71 3.27,21.32L13.27,11.32L3.27,1.32C2.88,0.93 2.88,0.3 3.27,-0.09C3.66,-0.48 4.29,-0.48 4.68,1.27Z"/></svg>
        Get on Google Play
      </a>
    </div>

    <div class="footer-links">
      <a href="https://tribalfs.github.io/">Back to tribalfs Home</a> &bull;
      <a href="https://github.com/tribalfs/BoxScorePub" target="_blank" rel="noopener">GitHub Project</a>
    </div>
  </div>

  <script>
    (function() {
      const packageName = "com.tribalfs.scorer";
      const fullPath = window.location.pathname + window.location.search + window.location.hash;
      const playStoreUrl = "https://play.google.com/store/apps/details?id=" + packageName;

      // Construct Android Intent URI
      // Matches Android Intent Scheme in Chrome:
      // intent://tribalfs.github.io/boxscore...#Intent;scheme=https;package=com.tribalfs.scorer;S.browser_fallback_url=...;end
      const intentUrl = "intent://tribalfs.github.io" + fullPath +
        "#Intent;scheme=https;package=" + packageName +
        ";S.browser_fallback_url=" + encodeURIComponent(playStoreUrl) + ";end";

      const openBtn = document.getElementById("open-app-btn");
      if (openBtn) {
        openBtn.href = intentUrl;
      }

      const statusBadge = document.getElementById("status-badge");
      const statusText = document.getElementById("status-text");

      const isAndroid = /Android/i.test(navigator.userAgent);

      if (isAndroid) {
        // Automatically attempt launching the app via Intent URI
        window.location.href = intentUrl;

        // If user remains on the page after 2.5s, update status text to prompt manual click
        setTimeout(function() {
          if (statusText) {
            statusText.textContent = "If the app didn't open, tap 'Open in Box Score App' below.";
          }
        }, 2500);
      } else {
        // Non-Android (Desktop or iOS)
        if (statusBadge) {
          statusBadge.style.display = "none";
        }
      }
    })();
  </script>
</body>
</html>
