name: Auto-Update app-ads.txt

on:
  schedule:
    # Runs every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  update-ads:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run update-ads.sh script
        run: |
          chmod +x update-ads.sh
          ./update-ads.sh --no-deploy

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-ads.txt public/app-ads.txt
          if git diff --staged --quiet; then
            echo "No changes to app-ads.txt"
          else
            git commit -m "auto: update app-ads.txt [scheduled]"
            git push
          fi
